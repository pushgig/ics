name: Run Tests
on:
  push:
    branches-ignore:
      - develop
      - main
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build
        run: yarn build
      - name: Check Formatting
        run: yarn prettier:check
      - name: Test
        run: yarn test
